name: keep-warm

# ping: Netlify functions cold-start after a few idle minutes, adding ~2.5s to
# the first click. A tiny ping every 5 minutes keeps the function warm.
#
# database: the Supabase project pauses after 7 days without database activity,
# and /login never touches the database. Twice a day this calls
# /api/cron/keepwarm, which runs a count query against "Clients".
# Needs the CRON_SECRET repo secret, set to the same value as Netlify's
# CRON_SECRET env var.
#
# GitHub disables scheduled workflows after 60 days without a commit (this one
# was disabled on 2026-09-29). The database job re-enables the workflow through
# the API on each run so the schedule doesn't lapse during a quiet stretch.
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 9,21 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping dashboard
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://app.getfield.co/login)
          echo "app.getfield.co/login -> $code"
          test "$code" = "200"

  database:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 9,21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query the database
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi
          body=$(curl -sS --max-time 90 -H "x-cron-secret: $CRON_SECRET" https://app.getfield.co/api/cron/keepwarm)
          echo "app.getfield.co/api/cron/keepwarm -> $body"
          echo "$body" | grep -q '"ok":true'

      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepwarm.yml/enable"
